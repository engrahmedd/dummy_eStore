<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="${product.name} + ' – PuzzleShop'">Product – PuzzleShop</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=Source+Sans+3:wght@400;500;600&display=swap"/>
    <link rel="stylesheet" th:href="@{/css/main.css}"/>
    <link rel="stylesheet" th:href="@{/css/product-details.css}"/>
</head>
<body>

<!-- ── Navigation ── -->
<nav th:replace="~{fragments/navbar :: navbar}"></nav>

<main class="page-wrapper">

    <!-- ── Back link ── -->
    <a th:href="@{/products}" class="back-link">← Back to Products</a>

    <!-- ── Inactive banner (admin only) ── -->
    <div sec:authorize="hasRole('ADMIN')"
         th:if="${!product.active}"
         class="inactive-banner">
        This product is currently <strong>inactive</strong> and not visible to customers.
    </div>

    <div class="product-layout">

        <!-- ── Left: Image gallery ── -->
        <div class="gallery">
            <div class="gallery-main">
                <img id="mainImage"
                     th:src="@{'/images/products-images/' + ${product.productCode} + '-01.jpg'}"
                     th:alt="${product.name}"
                     onerror="this.onerror=null; this.src=''"/>
            </div>
            <div class="gallery-thumbs" id="thumbs">
                <!-- Thumbnails injected by JS -->
            </div>
        </div>

        <!-- ── Right: Product info ── -->
        <div class="product-info">

            <h1 class="product-title" th:text="${product.name}"></h1>
            <p class="product-short-desc" th:text="${product.shortDescription}"></p>

            <div class="product-meta">
                <div class="meta-row">
                    <span class="meta-label">Price</span>
                    <span class="meta-value price" th:text="'$' + ${product.price}"></span>
                </div>
                <div class="meta-row">
                    <span class="meta-label">Manufacturer</span>
                    <span class="meta-value" th:text="${product.manufacturer.name}"></span>
                </div>
                <div class="meta-row">
                    <span class="meta-label">Pieces</span>
                    <span class="meta-value" th:text="${product.pieceCount}"></span>
                </div>
                <div class="meta-row">
                    <span class="meta-label">Difficulty</span>
                    <span class="meta-value" th:text="${product.difficulty.name()}"></span>
                </div>
                <div class="meta-row">
                    <span class="meta-label">Category</span>
                    <span class="meta-value" th:text="${#strings.replace(product.category.name(), '_', ' ')}"></span>
                </div>
            </div>

            <!-- ── Add to Cart box ── -->
            <div class="cart-box">
                <h3 class="cart-box-title">Add to Cart</h3>

                <!-- Not logged in -->
                <div sec:authorize="isAnonymous()" class="cart-box-anon">
                    <p>Please <a th:href="@{/login}">log in</a> to add this item to your cart.</p>
                    <a th:href="@{'/cart/pending?productCode=' + ${product.productCode} + '&quantity=1'}"
                       class="btn-primary">Login to Add</a>
                </div>

                <!-- Logged in customer -->
                <div sec:authorize="hasRole('CUSTOMER')">
                    <form th:action="@{/cart/add}" method="post" class="cart-form">
                        <input type="hidden" name="productCode" th:value="${product.productCode}"/>
                        <div class="qty-row">
                            <label for="quantity">Quantity</label>
                            <input id="quantity" name="quantity" type="number"
                                   value="1" min="1" max="99" class="qty-input"/>
                        </div>
                        <button type="submit" class="btn-primary btn-full">Add to Cart</button>
                    </form>
                </div>

                <!-- Admin sees info instead -->
                <div sec:authorize="hasRole('ADMIN')">
                    <p class="cart-box-admin-note">Admins cannot add items to cart.</p>
                </div>
            </div>

            <!-- ── Long description ── -->
            <div class="product-details-box">
                <h3 class="details-title">Details</h3>
                <p th:text="${product.longDescription}"></p>
            </div>

            <!-- ── Admin controls ── -->
            <div sec:authorize="hasRole('ADMIN')" class="admin-controls">
                <a th:href="@{'/admin/products/edit/' + ${product.productCode}}"
                   class="btn-admin btn-edit">Edit Product</a>

                <form th:if="${product.active}"
                      th:action="@{'/admin/products/deactivate/' + ${product.productCode}}"
                      method="post" style="display:inline;">
                    <button type="submit" class="btn-admin btn-deactivate">Deactivate</button>
                </form>

                <form th:unless="${product.active}"
                      th:action="@{'/admin/products/activate/' + ${product.productCode}}"
                      method="post" style="display:inline;">
                    <button type="submit" class="btn-admin btn-activate">Activate</button>
                </form>
                <form th:action="@{'/admin/products/delete/' + ${product.productCode}}"
                      method="post" style="display:inline;"
                      onsubmit="return confirm('Are you sure you want to delete this product? This cannot be undone.')">
                    <button type="submit" class="btn-admin btn-delete">Delete</button>
                </form>
            </div>

        </div>
    </div>
</main>

<script th:inline="javascript">
    const code = [[${product.productCode}]];
    const name = [[${product.name}]];
    const basePath = '/images/products-images/';
    const mainImg = document.getElementById('mainImage');
    const thumbsContainer = document.getElementById('thumbs');
    const maxImages = 8;

    function switchImage(src, thumb) {
        mainImg.src = src;
        document.querySelectorAll('.thumb').forEach(t => t.classList.remove('active'));
        thumb.classList.add('active');
    }

    function loadThumbs() {
        let loaded = 0;
        for (let i = 1; i <= maxImages; i++) {
            const src = basePath + code + '-0' + i + '.jpg';
            const img = new Image();
            img.onload = function () {
                const thumb = document.createElement('img');
                thumb.src = src;
                thumb.alt = name;
                thumb.className = 'thumb' + (loaded === 0 ? ' active' : '');
                thumb.onclick = () => switchImage(src, thumb);
                thumbsContainer.appendChild(thumb);
                loaded++;
            };
            img.src = src;
        }
    }

    loadThumbs();
</script>

</body>
</html>
