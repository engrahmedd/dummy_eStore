<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Register')}">
    <link rel="stylesheet" th:href="@{/css/products.css}"/>
</head>
<body>
<div class="login-wrapper">

    <a th:href="@{/}" class="back-link">← Back to Home</a>

    <div class="login-header">
        <h1 class="brand" th:text="Gearwood">Gearwood Store</h1>
        <p class="brand-sub">Create your account</p>
    </div>

    <div class="login-card">

        <div th:if="${errorMessage}" class="alert alert-error">
            <span th:text="${errorMessage}"></span>
        </div>
        <div th:if="${successMessage}" class="alert alert-success">
            <span th:text="${successMessage}"></span>
        </div>

        <form method="post" th:action="@{/register}">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

            <div class="form-field">
                <label for="firstName">First name</label>
                <input id="firstName" name="firstName" type="text"
                       placeholder="John" required/>
            </div>

            <div class="form-field">
                <label for="lastName">Last name</label>
                <input id="lastName" name="lastName" type="text"
                       placeholder="Doe" required/>
            </div>

            <div class="form-field">
                <label for="email">Email address</label>
                <input id="email" name="email" type="email"
                       placeholder="you@example.com" required/>
            </div>

            <div class="form-field">
                <label for="password">Password</label>
                <input id="password" name="password" type="password"
                       placeholder="••••••••" required/>
                <div class="show-password">
                    <input type="checkbox" id="showPassword" onchange="togglePassword('password')"/>
                    <label for="showPassword">Show password</label>
                </div>
            </div>

            <div class="form-field">
                <label for="confirmPassword">Confirm password</label>
                <input id="confirmPassword" name="confirmPassword" type="password"
                       placeholder="••••••••" required/>
                <div class="show-password">
                    <input type="checkbox" id="showConfirm" onchange="togglePassword('confirmPassword')"/>
                    <label for="showConfirm">Show password</label>
                </div>
            </div>

            <button type="submit" class="btn btn-primary btn-full">Create account</button>
        </form>
    </div>

    <p class="login-footer">
        Already have an account?
        <a th:href="@{/login}">Sign in</a>
    </p>
</div>

<script>
    function togglePassword(fieldId) {
        const field = document.getElementById(fieldId);
        field.type = field.type === 'password' ? 'text' : 'password';
    }
</script>
</body>
</html>
