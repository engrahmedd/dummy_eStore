<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Change Password – PuzzleShop</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=Source+Sans+3:wght@400;500;600&display=swap"/>
    <link rel="stylesheet" th:href="@{/css/main.css}"/>
    <link rel="stylesheet" th:href="@{/css/account.css}"/>
</head>
<body>

<nav th:replace="~{fragments/navbar :: navbar}"></nav>

<main class="page-wrapper">
    <div class="account-layout">

        <aside class="account-sidebar">
            <div class="sidebar-avatar">
                <span th:text="${#strings.substring(user.firstName, 0, 1) + #strings.substring(user.lastName, 0, 1)}"></span>
            </div>
            <p class="sidebar-name" th:text="${user.firstName + ' ' + user.lastName}"></p>
            <p class="sidebar-email" th:text="${user.email}"></p>

            <nav class="sidebar-nav">
                <a th:href="@{/account}" class="sidebar-link">Overview</a>
                <a th:href="@{/account/orders}" class="sidebar-link">Order History</a>
                <a th:href="@{/account/edit}" class="sidebar-link">Edit Account</a>
                <a th:href="@{/account/change-password}" class="sidebar-link">Change Password</a>
            </nav>
        </aside>

        <div class="account-content">
            <a th:href="@{/account}" class="back-link">← Back to Account</a>
            <h1 class="page-title">Change Password</h1>

            <div th:if="${errorMessage}" class="alert alert-error">
                <span th:text="${errorMessage}"></span>
            </div>
            <div th:if="${successMessage}" class="alert alert-success">
                <span th:text="${successMessage}"></span>
            </div>

            <div class="account-card">
                <form th:action="@{/account/change-password}"
                      th:object="${passwordForm}" method="post">

                    <div class="form-field">
                        <label for="currentPassword">Current Password</label>
                        <input id="currentPassword" th:field="*{currentPassword}"
                               type="password"/>
                        <div class="show-password">
                            <input type="checkbox" id="showCurrent"
                                   onchange="togglePassword('currentPassword')"/>
                            <label for="showCurrent">Show password</label>
                        </div>
                    </div>

                    <div class="form-field">
                        <label for="newPassword">New Password</label>
                        <input id="newPassword" th:field="*{newPassword}"
                               type="password"/>
                        <div class="show-password">
                            <input type="checkbox" id="showNew"
                                   onchange="togglePassword('newPassword')"/>
                            <label for="showNew">Show password</label>
                        </div>
                    </div>

                    <div class="form-field">
                        <label for="confirmPassword">Confirm New Password</label>
                        <input id="confirmPassword" th:field="*{confirmPassword}"
                               type="password"/>
                        <div class="show-password">
                            <input type="checkbox" id="showConfirm"
                                   onchange="togglePassword('confirmPassword')"/>
                            <label for="showConfirm">Show password</label>
                        </div>
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="btn-primary">Update Password</button>
                        <a th:href="@{/account}" class="btn-cancel">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</main>

<script>
    function togglePassword(fieldId) {
        const field = document.getElementById(fieldId);
        field.type = field.type === 'password' ? 'text' : 'password';
    }
</script>

</body>
</html>
