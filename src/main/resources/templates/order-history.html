<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Order History – PuzzleShop</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=Source+Sans+3:wght@400;500;600&display=swap"/>
    <link rel="stylesheet" th:href="@{/css/main.css}"/>
    <link rel="stylesheet" th:href="@{/css/account.css}"/>
</head>
<body>

<nav th:replace="~{fragments/navbar :: navbar}"></nav>

<main class="page-wrapper">
    <div class="account-layout">

        <aside class="account-sidebar">
            <div class="sidebar-avatar">
                <span th:text="${#strings.substring(user.firstName, 0, 1) + #strings.substring(user.lastName, 0, 1)}"></span>
            </div>
            <p class="sidebar-name" th:text="${user.firstName + ' ' + user.lastName}"></p>
            <p class="sidebar-email" th:text="${user.email}"></p>

            <nav class="sidebar-nav">
                <a th:href="@{/account}" class="sidebar-link">Overview</a>
                <a th:href="@{/account/orders}" class="sidebar-link">Order History</a>
                <a th:href="@{/account/edit}" class="sidebar-link">Edit Account</a>
                <a th:href="@{/account/change-password}" class="sidebar-link">Change Password</a>
            </nav>
        </aside>

        <div class="account-content">
            <h1 class="page-title">Order History</h1>

            <div th:if="${#lists.isEmpty(orders)}" class="empty-state">
                <p>You haven't placed any orders yet.</p>
                <a th:href="@{/products}" class="btn-primary">Start Shopping</a>
            </div>

            <div th:unless="${#lists.isEmpty(orders)}" class="account-card no-padding">
                <div class="orders-table">
                    <div class="orders-table-header">
                        <span>Order</span>
                        <span>Date</span>
                        <span>Status</span>
                        <span>Total</span>
                        <span></span>
                    </div>
                    <div th:each="order : ${orders}" class="orders-table-row">
                        <span class="order-number" th:text="${order.orderNumber}"></span>
                        <span th:text="${order.orderDate.toLocalDate()}"></span>
                        <span class="order-status" th:text="${order.status}"></span>
                        <span th:text="'$' + ${order.orderTotal}"></span>
                        <a th:href="@{'/account/orders/' + ${order.orderNumber}}"
                           class="btn-view">View</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

</body>
</html>
