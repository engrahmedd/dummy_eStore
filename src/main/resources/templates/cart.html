<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Cart – PuzzleShop</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=Source+Sans+3:wght@400;500;600&display=swap"/>
    <link rel="stylesheet" th:href="@{/css/main.css}"/>
    <link rel="stylesheet" th:href="@{/css/cart.css}"/>
</head>
<body>

<!-- ── Navigation ── -->
<nav th:replace="~{fragments/navbar :: navbar}"></nav>

<main class="page-wrapper">

    <div class="page-header">
        <h1 class="page-title">Your Cart</h1>
    </div>

    <!-- ── Alerts ── -->
    <div th:if="${errorMessage}" class="alert alert-error">
        <span th:text="${errorMessage}"></span>
    </div>
    <div th:if="${successMessage}" class="alert alert-success">
        <span th:text="${successMessage}"></span>
    </div>

    <!-- ── Empty cart ── -->
    <div th:if="${#lists.isEmpty(cart.items)}" class="empty-cart">
        <p>Your cart is empty.</p>
        <a th:href="@{/products}" class="btn-primary">Browse Products</a>
    </div>

    <!-- ── Cart contents ── -->
    <div th:unless="${#lists.isEmpty(cart.items)}" class="cart-layout">

        <!-- ── Cart items ── -->
        <div class="cart-items">
            <div th:each="item : ${cart.items}" class="cart-item">

                <div class="cart-item-image">
                    <img th:src="@{'/images/products-images/' + ${item.product.productCode} + '-01.jpg'}"
                         th:alt="${item.product.name}"
                         onerror="this.onerror=null; this.src=''"/>
                </div>

                <div class="cart-item-details">
                    <a th:href="@{'/products/' + ${item.product.productCode}}"
                       class="cart-item-name"
                       th:text="${item.product.name}">
                    </a>
                    <span class="cart-item-meta"
                          th:text="${item.product.manufacturer.name}">
                    </span>
                    <span class="cart-item-price"
                          th:text="'$' + ${item.product.price} + ' each'">
                    </span>
                </div>

                <div class="cart-item-actions">
                    <!-- Update quantity -->
                    <form th:action="@{/cart/update}" method="post" class="qty-form">
                        <input type="hidden" name="cartItemId" th:value="${item.id}"/>
                        <input type="number" name="quantity"
                               th:value="${item.quantity}"
                               min="1" max="99"
                               class="qty-input"
                               onchange="this.form.submit()"/>
                    </form>

                    <!-- Line total -->
                    <span class="cart-item-total"
                          th:text="'$' + ${item.lineTotal}">
                    </span>

                    <!-- Remove -->
                    <form th:action="@{/cart/remove}" method="post">
                        <input type="hidden" name="cartItemId" th:value="${item.id}"/>
                        <button type="submit" class="btn-remove">Remove</button>
                    </form>
                </div>

            </div>
        </div>

        <!-- ── Order summary ── -->
        <div class="cart-summary">
            <h2 class="summary-title">Order Summary</h2>

            <div class="summary-rows">
                <div class="summary-row"
                     th:each="item : ${cart.items}">
                    <span th:text="${item.product.name}"></span>
                    <span th:text="'$' + ${item.lineTotal}"></span>
                </div>
            </div>

            <div class="summary-divider"></div>

            <div class="summary-total">
                <span>Total</span>
                <span th:text="'$' + ${cartTotal}"></span>
            </div>

            <a th:href="@{/checkout}" class="btn-primary btn-full btn-checkout">
                Proceed to Checkout
            </a>

            <a th:href="@{/products}" class="btn-continue">
                Continue Shopping
            </a>
        </div>

    </div>
</main>

</body>
</html>
