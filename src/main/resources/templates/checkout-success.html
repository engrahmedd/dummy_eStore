<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Order Confirmed – PuzzleShop</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=Source+Sans+3:wght@400;500;600&display=swap"/>
    <link rel="stylesheet" th:href="@{/css/main.css}"/>
    <link rel="stylesheet" th:href="@{/css/checkout.css}"/>
</head>
<body>

<nav th:replace="~{fragments/navbar :: navbar}"></nav>

<main class="page-wrapper">
    <div class="success-wrapper">

        <!-- ── Success header ── -->
        <div class="success-header">
            <div class="success-icon">✓</div>
            <h1 class="success-title">Order Confirmed!</h1>
            <p class="success-sub">
                Thank you for your purchase. Your order has been placed successfully.
            </p>
        </div>

        <!-- ── Order details card ── -->
        <div class="order-card">

            <div class="order-meta-grid">
                <div class="order-meta-item">
                    <span class="meta-label">Order Number</span>
                    <span class="meta-value" th:text="${order.orderNumber}"></span>
                </div>
                <div class="order-meta-item">
                    <span class="meta-label">Order Date</span>
                    <span class="meta-value"
                          th:text="${#temporals.format(order.orderDate, 'MMM dd, yyyy HH:mm')}">
                    </span>
                </div>
                <div class="order-meta-item">
                    <span class="meta-label">Status</span>
                    <span class="meta-value status-confirmed" th:text="${order.status}"></span>
                </div>
                <div class="order-meta-item">
                    <span class="meta-label">Transaction ID</span>
                    <span class="meta-value mono" th:text="${order.transactionId}"></span>
                </div>
            </div>

            <div class="order-divider"></div>

            <!-- ── Shipping ── -->
            <div class="order-section">
                <h3 class="order-section-title">Shipping To</h3>
                <p th:text="${order.shippingName}"></p>
                <p th:text="${order.shippingAddress}"></p>
                <p th:text="${order.shippingCity + ', ' + order.shippingState + ' ' + order.shippingZip}"></p>
            </div>

            <div class="order-divider"></div>

            <!-- ── Items ── -->
            <div class="order-section">
                <h3 class="order-section-title">Items Ordered</h3>
                <div class="order-items">
                    <div th:each="item : ${order.items}" class="order-item">
                        <div class="order-item-image">
                            <img th:src="@{'/images/products-images/' + ${item.product.productCode} + '-01.jpg'}"
                                 th:alt="${item.productNameAtPurchase}"
                                 onerror="this.onerror=null; this.src=''"/>
                        </div>
                        <div class="order-item-details">
                            <span class="order-item-name"
                                  th:text="${item.productNameAtPurchase}"></span>
                            <span class="order-item-meta"
                                  th:text="'Qty: ' + ${item.quantity} + ' × $' + ${item.unitPriceAtPurchase}">
                            </span>
                        </div>
                        <span class="order-item-total"
                              th:text="'$' + ${item.lineTotal}"></span>
                    </div>
                </div>
            </div>

            <div class="order-divider"></div>

            <!-- ── Total ── -->
            <div class="order-total-row">
                <span>Order Total</span>
                <span th:text="'$' + ${order.orderTotal}"></span>
            </div>

        </div>

        <!-- ── Actions ── -->
        <div class="success-actions">
            <a th:href="@{/account/orders}" class="btn-primary">View Order History</a>
            <a th:href="@{/products}" class="btn-continue">Continue Shopping</a>
        </div>

    </div>
</main>

</body>
</html>
