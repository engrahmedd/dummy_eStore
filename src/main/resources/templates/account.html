<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>My Account – PuzzleShop</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=Source+Sans+3:wght@400;500;600&display=swap"/>
    <link rel="stylesheet" th:href="@{/css/main.css}"/>
    <link rel="stylesheet" th:href="@{/css/account.css}"/>
</head>
<body>

<nav th:replace="~{fragments/navbar :: navbar}"></nav>

<main class="page-wrapper">

    <div th:if="${errorMessage}" class="alert alert-error">
        <span th:text="${errorMessage}"></span>
    </div>
    <div th:if="${successMessage}" class="alert alert-success">
        <span th:text="${successMessage}"></span>
    </div>

    <div class="account-layout">

        <!-- ── Sidebar ── -->
        <aside class="account-sidebar">
            <div class="sidebar-avatar">
                <span th:text="${#strings.substring(user.firstName, 0, 1) + #strings.substring(user.lastName, 0, 1)}"></span>
            </div>
            <p class="sidebar-name" th:text="${user.firstName + ' ' + user.lastName}"></p>
            <p class="sidebar-email" th:text="${user.email}"></p>

            <nav class="sidebar-nav">
                <a th:href="@{/account}" class="sidebar-link active">Overview</a>
                <a th:href="@{/account/orders}" class="sidebar-link">Order History</a>
                <a th:href="@{/account/edit}" class="sidebar-link">Edit Account</a>
                <a th:href="@{/account/change-password}" class="sidebar-link">Change Password</a>
            </nav>
        </aside>

        <!-- ── Main content ── -->
        <div class="account-content">

            <h1 class="page-title">My Account</h1>

            <!-- ── Account info ── -->
            <div class="account-card">
                <div class="card-header">
                    <h2 class="card-title">Personal Information</h2>
                    <a th:href="@{/account/edit}" class="btn-edit-link">Edit</a>
                </div>
                <div class="info-grid">
                    <div class="info-item">
                        <span class="info-label">First Name</span>
                        <span class="info-value" th:text="${user.firstName}"></span>
                    </div>
                    <div class="info-item">
                        <span class="info-label">Last Name</span>
                        <span class="info-value" th:text="${user.lastName}"></span>
                    </div>
                    <div class="info-item">
                        <span class="info-label">Email</span>
                        <span class="info-value" th:text="${user.email}"></span>
                    </div>
                    <div class="info-item">
                        <span class="info-label">Password</span>
                        <a th:href="@{/account/change-password}" class="info-link">Change password</a>
                    </div>
                </div>
            </div>

            <!-- ── Recent orders ── -->
            <div class="account-card">
                <div class="card-header">
                    <h2 class="card-title">Recent Orders</h2>
                    <a th:href="@{/account/orders}" class="btn-edit-link">View All</a>
                </div>

                <div th:if="${#lists.isEmpty(recentOrders)}" class="empty-state">
                    <p>You haven't placed any orders yet.</p>
                    <a th:href="@{/products}" class="btn-primary">Start Shopping</a>
                </div>

                <div th:unless="${#lists.isEmpty(recentOrders)}" class="orders-table">
                    <div class="orders-table-header">
                        <span>Order</span>
                        <span>Date</span>
                        <span>Status</span>
                        <span>Total</span>
                        <span></span>
                    </div>
                    <div th:each="order : ${recentOrders}" class="orders-table-row">
                        <span class="order-number" th:text="${order.orderNumber}"></span>
                        <span th:text="${order.orderDate.toLocalDate()}"></span>
                        <span class="order-status" th:text="${order.status}"></span>
                        <span th:text="'$' + ${order.orderTotal}"></span>
                        <a th:href="@{'/account/orders/' + ${order.orderNumber}}"
                           class="btn-view">View</a>
                    </div>
                </div>
            </div>

        </div>
    </div>
</main>

</body>
</html>
